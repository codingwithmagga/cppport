name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - run: pip install pytest ruff build

      - run: ruff check .
      - run: pytest --cov=src --cov-report=term-missing

      - run: python -m build
      - run: cppport --help